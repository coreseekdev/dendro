[package]
name = "dendro-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "dendro_server"
path = "src/lib.rs"

[[bin]]
name = "dendro"
path = "src/main.rs"

[dependencies]
dendro-core.workspace = true
dendro-pgwire.workspace = true
dendro-mywire.workspace = true
dendro-columnar.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
rand.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
tokio-postgres = "0.7"
mysql = "26"
