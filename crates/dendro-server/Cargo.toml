[package]
name = "dendro-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "dendro_server"
path = "src/lib.rs"

[[bin]]
name = "dendro"
path = "src/main.rs"

[dependencies]
flate2 = "1"
dendro-core.workspace = true
dendro-pgwire.workspace = true
dendro-mywire.workspace = true
dendro-columnar.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arrow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
rand.workspace = true
signal-hook = "0.3"

tikv-jemallocator = { version = "0.6", optional = true }
tikv-jemalloc-ctl = { version = "0.6", optional = true, features = ["use_std", "stats"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
tokio-postgres = "0.7"
mysql = "26"

[features]
# tikv 维护的 jemalloc 绑定（决策见 docs/research/allocator-evaluation.md）：
# 默认开启（unix-only；win port 自动回落系统分配器）；--no-default-features 保留 A/B 逃生口
default = ["jemalloc"]
jemalloc = ["tikv-jemallocator", "tikv-jemalloc-ctl"]
