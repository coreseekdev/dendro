[package]
name = "dendro-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "dendro_server"
path = "src/lib.rs"

[[bin]]
name = "dendro"
path = "src/main.rs"

[dependencies]
flate2 = "1"
dendro-core.workspace = true
dendro-pgwire.workspace = true
dendro-mywire.workspace = true
dendro-columnar.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arrow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
rand.workspace = true
signal-hook = "0.3"

rusqlite = { version = "0.37", features = ["bundled"] }
tikv-jemallocator = { version = "0.6", optional = true }
tikv-jemalloc-ctl = { version = "0.6", optional = true, features = ["use_std", "stats"] }

# 基准内火焰图（DENDRO_FLAME=path 环境变量激活——sqlite-cmp 采样出 SVG；
# perf_event_paranoid 环境的 CPU 剖析，见 docs/research/SQL机器热点剖析）
pprof = { version = "0.15", features = ["flamegraph"] }

[dev-dependencies]
bytes = "1"
delegate = "0.13"
tokio = { version = "1", features = ["rt", "macros"] }
tokio-postgres = "0.7"
mysql = "26"

[features]
# tikv 维护的 jemalloc 绑定（决策见 docs/research/allocator-evaluation.md）：
# 默认开启（unix-only；win port 自动回落系统分配器）；--no-default-features 保留 A/B 逃生口
default = ["jemalloc"]
jemalloc = ["tikv-jemallocator", "tikv-jemalloc-ctl"]
